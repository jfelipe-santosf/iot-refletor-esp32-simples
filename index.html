<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>ESP32 MQTT HiveMQ</title>

        <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

        <style>
            body{
                background:#121212;
                color:white;
                font-family:Arial;
                margin:0;
                height:100vh;

                display:flex;
                justify-content:center;
                align-items:center;
            }

            .box{
                text-align:center;
            }

            button{
                width:200px;
                height:60px;
                margin:10px;
                border:none;
                border-radius:10px;
                font-size:20px;
                cursor:pointer;
            }

            .on{
                background:green;
                color:white;
            }

            .off{
                background:red;
                color:white;
            }
            .switch {
                position: relative;
                display: inline-block;
                width: 60px;
                height: 34px;
            }

            /* Hide default HTML checkbox */
            .switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }

            /* The slider */
            .slider {
                position: absolute;
                cursor: pointer;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: #ccc;
                -webkit-transition: .4s;
                transition: .4s;
            }

            .slider:before {
                position: absolute;
                content: "";
                height: 26px;
                width: 26px;
                left: 4px;
                bottom: 4px;
                background-color: white;
                -webkit-transition: .4s;
                transition: .4s;
            }

            input:checked + .slider {
                background-color: #2196F3;
            }

            input:focus + .slider {
                box-shadow: 0 0 1px #2196F3;
            }

            input:checked + .slider:before {
                -webkit-transform: translateX(26px);
                -ms-transform: translateX(26px);
                transform: translateX(26px);
            }

            /* Rounded sliders */
            .slider.round {
                border-radius: 34px;
            }

            .slider.round:before {
                border-radius: 50%;
            }
            .form-control{
                display: block;
                width: 100%;
                max-width: 260px;
                height: 40px;
                margin: 8px auto;
                border-radius: 5px;
                border: none;
                padding: 0 10px;
                background: #1e1e1e;
                color: #fff;
                box-sizing: border-box;
            }
            .box-login,
            .box{
                width:100%;
                max-width:320px;
                text-align:center;

                display:flex;
                flex-direction:column;
                align-items:center;
                justify-content:center;
            }
            .box-login {
                gap: 8px;
            }
            .btn {
                width: 100%;
                max-width: 260px;
                height: 44px;
                border-radius: 8px;
                border: none;
                background: #2196F3;
                color: #fff;
                font-size: 16px;
                cursor: pointer;
                margin: 8px auto;
            }
            .password-box{
                position: relative;
                width: 100%;
                max-width: 260px;
            }

            .password-box .form-control{
                max-width: 100%;
                padding-right: 40px;
                box-sizing: border-box;
            }

            .toggle-password{
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                cursor: pointer;
                user-select: none;
                font-size: 18px;
            }
        </style>
    </head>
    <body>
        <div class="box-login">
            <input id="mqtt-user" class="form-control" type="text" placeholder="Usuário MQTT">
            <div class="password-box">
                <input id="mqtt-pass" class="form-control" type="password" placeholder="Senha MQTT">
                <span class="toggle-password" onclick="togglePassword()">
                    <i id="eye-icon" class="fa-solid fa-eye"></i>
                </span>
            </div>
            <button class="btn btn-primary" onclick="login()">Entrar</button>
        </div>
        <div id="loading" style="display:none;margin-top:10px;color:#fff;">Carregando conexão MQTT...</div>
        <div class="box" style="display: none;">

            <h1>Controle refletor via ESP32</h1>

            <button class="on" onclick="ligar()">
                LIGAR
            </button>

            <button class="off" onclick="desligar()">
                DESLIGAR
            </button>

            <h3 id="status">
                Conectando...
            </h3>

            <h2>Agendamento (18h - 00h)</h2>
            <!-- Rounded switch -->
            <label class="switch">
                <input type="checkbox" id="schedule-input">
                <span class="slider round"></span>
            </label>

        </div>

        <script>

            function togglePassword(){
                const input = document.getElementById("mqtt-pass");
                const icon = document.getElementById("eye-icon");

                if(input.type === "password"){
                    input.type = "text";
                    icon.className = "fa-solid fa-eye-slash";
                }else{
                    input.type = "password";
                    icon.className = "fa-solid fa-eye";
                }
            }

            let client;
            let connectTimer;
            let scheduleStatusReceived = false;
            const webTopic = 'web/iot-refletor-esp32-simples';
            const espTopic = 'esp32/iot-refletor-esp32-simples';

            ["mqtt-user", "mqtt-pass"].forEach(id => {
                document.getElementById(id).addEventListener("keydown", function(event) {
                    if (event.key === "Enter" || event.key === "NumpadEnter") {
                        login();
                    }
                });
            });

            function check_inputs() {
                const user = document.getElementById("mqtt-user").value;
                const pass = document.getElementById("mqtt-pass").value;

                if (!user || !pass) {
                    alert('Por favor, preencha usuário e senha MQTT.');
                    return false;
                }
                return true;
            }

            function login(){
                if (!check_inputs()) return;

                document.getElementsByClassName("box-login")[0].style.display = "none";
                document.getElementById("loading").style.display = "block";

                const mqtt_user = document.getElementById("mqtt-user").value;
                const mqtt_pass = document.getElementById("mqtt-pass").value;

                const options = {
                    connectTimeout: 4000,
                    clientId: 'web_' + Math.random().toString(16).substr(2, 8),
                    clean: true,
                };

                if (mqtt_user) options.username = mqtt_user;
                if (mqtt_pass) options.password = mqtt_pass;

                client = mqtt.connect(
                    'wss://2201cadbf6a44205ab10d1d828b056f1.s1.eu.hivemq.cloud:8884/mqtt',
                    options
                );

                connectTimer = setTimeout(() => {
                    if (!client || !client.connected) {
                        document.getElementById("loading").style.display = "none";
                        document.getElementById("status").innerText = "TIMEOUT MQTT";
                        alert('Timeout de conexão MQTT atingido. Verifique usuário, senha e conexão.');
                        if (client) client.end(true);
                    }
                }, 5000);

                client.on('connect', function () {
                    clearTimeout(connectTimer);
                    document.getElementById("loading").style.display = "none";
                    document.getElementById("status").innerText = "MQTT CONECTADO";
                    client.subscribe(webTopic);
                    alert('MQTT conectado com sucesso!');
                document.getElementsByClassName("box")[0].style.display = "flex";
                    client.publish(espTopic, 'SCHEDULE');
                });

                client.on('message', function (topic, message) {
                    message = message.toString();

                    if (message == "ON-SCHEDULE") {
                        document.getElementById("schedule-input").checked = true;

                        if (!scheduleStatusReceived) {
                            alert("Agendamento ativado pelo ESP32");
                            scheduleStatusReceived = true;
                        }

                    } else if (message == "OFF-SCHEDULE") {
                        document.getElementById("schedule-input").checked = false;

                        if (!scheduleStatusReceived) {
                            alert("Agendamento desativado pelo ESP32");
                            scheduleStatusReceived = true;
                        }
                    }
                });

                client.on('error', function (err) {
                    clearTimeout(connectTimer);
                    document.getElementById("loading").style.display = "none";
                    document.getElementById("status").innerText = "ERRO MQTT";
                    const errorMessage = err && err.message ? err.message : String(err);
                    if (errorMessage.includes("Not authorized") || errorMessage.includes("Connection refused")) {
                        alert('Verifique usuário e senha MQTT.');
                        document.getElementsByClassName("box-login")[0].style.display = "flex";
                        document.getElementById("loading").style.display = "none";
                        document.getElementsByClassName("box")[0].style.display = "none";

                        return;
                    }
                    alert('Erro MQTT: ' + errorMessage);
                });

                const schedule_checkbox = document.getElementById("schedule-input");
                schedule_checkbox.addEventListener('change', function() {
                    if (!client) return;
                    if (this.checked) {
                        client.publish(espTopic, 'ON-SCHEDULE');
                        console.log('Enviado: ON-SCHEDULE');
                    } else {
                        client.publish(espTopic, 'OFF-SCHEDULE');
                        console.log('Enviado: OFF-SCHEDULE');
                    }
                });
            }

            function ligar(){
                if (!client) return alert('MQTT não conectado');
                client.publish(espTopic, 'ON');
                console.log('Comando enviado: ON');
            }

            function desligar(){
                if (!client) return alert('MQTT não conectado');
                client.publish(
                    espTopic,
                    'OFF'
                );
                console.log('Comando enviado: OFF');
            }

        </script>

    </body>
</html>
