<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>ESP32 MQTT HiveMQ</title>

        <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

        <style>
            body{
                background:#121212;
                color:white;
                font-family:Arial;
                display:flex;
                justify-content:center;
                align-items:center;
                height:100vh;
            }

            .box{
                text-align:center;
            }

            button{
                width:200px;
                height:60px;
                margin:10px;
                border:none;
                border-radius:10px;
                font-size:20px;
                cursor:pointer;
            }

            .on{
                background:green;
                color:white;
            }

            .off{
                background:red;
                color:white;
            }
            .switch {
                position: relative;
                display: inline-block;
                width: 60px;
                height: 34px;
            }

            /* Hide default HTML checkbox */
            .switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }

            /* The slider */
            .slider {
                position: absolute;
                cursor: pointer;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: #ccc;
                -webkit-transition: .4s;
                transition: .4s;
            }

            .slider:before {
                position: absolute;
                content: "";
                height: 26px;
                width: 26px;
                left: 4px;
                bottom: 4px;
                background-color: white;
                -webkit-transition: .4s;
                transition: .4s;
            }

            input:checked + .slider {
                background-color: #2196F3;
            }

            input:focus + .slider {
                box-shadow: 0 0 1px #2196F3;
            }

            input:checked + .slider:before {
                -webkit-transform: translateX(26px);
                -ms-transform: translateX(26px);
                transform: translateX(26px);
            }

            /* Rounded sliders */
            .slider.round {
                border-radius: 34px;
            }

            .slider.round:before {
                border-radius: 50%;
            }
        </style>
    </head>
    <body>

        <div class="box">

            <h1>Controle refletor via ESP32</h1>

            <button class="on" onclick="ligar()">
                LIGAR
            </button>

            <button class="off" onclick="desligar()">
                DESLIGAR
            </button>

            <h3 id="status">
                Conectando...
            </h3>

            <h2>Agendamento (18h - 00h)</h2>
            <!-- Rounded switch -->
            <label class="switch">
                <input type="checkbox" id="schedule-input">
                <span class="slider round"></span>
            </label>

        </div>

        <script>

            const webTopic = 'web/iot-refletor-esp32-simples';
            const espTopic = 'esp32/iot-refletor-esp32-simples';

            const options = {

            connectTimeout: 4000,

            clientId:
                'web_' +
                Math.random().toString(16).substr(2, 8),

            clean: true
            };

            const client = mqtt.connect(
            'wss://broker.hivemq.com:8884/mqtt',
            options
            );

            client.on('connect', function () {

                console.log('Conectado');

                document.getElementById("status").innerText = "MQTT CONECTADO";

                client.subscribe(webTopic);
            });

            client.on('message', function (topic, message) {
                message = message.toString();

                if (message == "ON-SCHEDULE") {
                    
                    document.getElementById("schedule-input").checked = true;
                } else if (message == "OFF-SCHEDULE") {
                    
                    document.getElementById("schedule-input").checked = false;
                }
            });

            client.on('error', function (err) {

                console.log(err);

                document.getElementById("status").innerText = "ERRO MQTT";
            });

            window.onload = () => {

                client.publish(
                    espTopic,
                    'SCHEDULE'
                );
            };

            schedule_checkbox = document.getElementById("schedule-input");
            schedule_checkbox.addEventListener('change', function() {
                if (this.checked) {
                    client.publish(
                        espTopic,
                        'ON-SCHEDULE'
                    );
                } else {
                    client.publish(
                        espTopic,
                        'OFF-SCHEDULE'
                    );
                }
            });

            function ligar(){

                client.publish(
                    espTopic,
                    'ON'
                );

                console.log("ON enviado");
            }

            function desligar(){

                client.publish(
                    espTopic,
                    'OFF'
                );

                console.log("OFF enviado");
            }

        </script>

    </body>
</html>
